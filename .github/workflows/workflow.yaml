name: cicd

on:
  push:
    branches:
      - 'feature/**' # match an pushes on feature/* and feature/<any sub branch>/*
      - master
    paths-ignore: # dont run when changes made to these folders
      - '.vscode/**'

# never run two releases of the same branch at once, they would race on the version tag
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cicd:
    name: cicd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the version commit, tag and release
    env:
      # feature/** branches only build the vsix; tagging and publishing happen on master only
      RELEASE: ${{ github.ref == 'refs/heads/master' }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all history and tags for gitversion

      - name: check that the commit is still the tip of the branch
        if: env.RELEASE == 'true'
        run: |
          tip=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is no longer the tip of $GITHUB_REF_NAME (now $tip). Re-running an outdated release can't push its version tag, push a new commit to release instead."
            exit 1
          fi

      - name: install gitversion tool
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: execute gitversion
        id: gitversion # step id used as reference for output values
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: print gitversion
        run: |
          echo "Major: ${{ steps.gitversion.outputs.major }}"
          echo "Minor: ${{ steps.gitversion.outputs.minor }}"
          echo "Patch: ${{ steps.gitversion.outputs.patch }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "VERSION=${{ steps.gitversion.outputs.majorMinorPatch }}" >> "$GITHUB_ENV"

      - name: setup node and yarn from .prototools
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: install dependencies
        run: yarn install --frozen-lockfile

      - name: run tests
        run: yarn test

      - name: build grammars
        run: yarn build:grammars

      - name: update version in package.json
        run: npm pkg set version="$VERSION"

      - name: run prettier
        run: yarn prettier:package

      - name: compile for node
        run: yarn node:package

      - name: compile for worker
        run: yarn web:package

      - name: compile and create vsix
        run: yarn vs:package

      - name: upload vsix as artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/vscode-glimmer-syntax-${{ env.VERSION }}.vsix
          archive: false # upload the .vsix itself instead of a zip around it

      # Release steps: commit and tag locally, publish, and only then push.
      # If publishing fails nothing is pushed, so the run can simply be re-run.

      - name: commit grammars and package.json, tag version
        if: env.RELEASE == 'true'
        run: |
          git config user.name 'github-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add syntaxes
          git diff --cached --quiet || git commit -m "chore: build grammar json files for $VERSION"
          git add package.json
          git diff --cached --quiet || git commit -m "chore: update package.json version to $VERSION"
          git tag "v$VERSION"

      - name: publish to marketplace VSCODE
        if: env.RELEASE == 'true'
        env:
          # Azure DevOps PAT with Marketplace (Manage) scope, it expires and has to be rotated in the repo secrets
          VSCODE_STORE_TOKEN: ${{ secrets.VSCODE_STORE_TOKEN }}
        run: yarn vs:publish:ci --packagePath "vscode-glimmer-syntax-$VERSION.vsix" --skip-duplicate

      - name: publish to marketplace OPEN VSX
        if: env.RELEASE == 'true'
        env:
          # open-vsx.org access token
          OPEN_VSX_STORE_TOKEN: ${{ secrets.OPEN_VSX_STORE_TOKEN }}
        run: yarn ov:publish:ci --packagePath "vscode-glimmer-syntax-$VERSION.vsix" --skip-duplicate

      - name: push version commit and tag
        if: env.RELEASE == 'true'
        run: git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/v$VERSION"

      - name: create a release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --title "v$VERSION" --verify-tag --generate-notes
